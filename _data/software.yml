# Open-source software for the RoboCup@Home community.
# The CfP counts only DOCUMENTED, ACTIVE repositories. Before listing a repository, check:
#   - it is public, has a README with install + usage instructions, and was updated recently
#   - `docs` points to the README (or documentation site)
#   - `readme_lang` says which languages the README is available in
# `checked` = date someone last verified the entry (YYYY-MM-DD).

