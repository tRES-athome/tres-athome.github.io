# People of tRES.
# Required by the CfP: Principal Investigator (with website link), Team Leader, Contact Person.
# Do NOT publish personal e-mail addresses without the person's consent.
# Fill in `name`, `affiliation`, `url` and set `confirmed: true` when final.

roles:
  - role: "Principal Investigator"
    name: ""
    affiliation: ""
    url: ""            # link to the PI's research group / personal website (required)
    confirmed: false
  - role: "Team Leader"
    name: ""
    affiliation: ""
    url: ""
    confirmed: false
  - role: "Contact Person"
    name: ""
    affiliation: ""
    url: ""
    confirmed: false

# How to contact tRES (shown on the People page and in the footer).
# Use a team address or contact form; avoid raw addresses (spam) — write e.g. "contact [at] example.org".
contact:
  method: ""           # e.g. "E-mail: tres [at] example.org"
  confirmed: false

# Team members, grouped by team. Leave `members` empty until the roster is final.
