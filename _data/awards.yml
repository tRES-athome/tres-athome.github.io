# Competition history and awards.
# IMPORTANT: every entry states WHICH TEAM achieved it. tRES itself has no results yet.
#   teams:   list of team ids (sobits | erasers | ready | tres)
#   entrant: team name as recorded at the event (e.g. a former joint-team name)
#   scope:   world    = RoboCup world championship
#            regional = RoboCup regional / national opens (Japan Open, Asia Pacific, ...)
#            other    = other robotics competitions and academic awards
#   date:    YYYY-MM (used for sorting; only the year is shown)
#   year_label: optional text shown instead of the year (e.g. "2021–2023")
#   verify:  optional — shown as a "To be confirmed" badge with this explanation
#   source:  URL the entry was taken from

